
spring.application.name=task-management-api-test

# Isolated H2 database for automated tests
spring.datasource.url=jdbc:h2:mem:task_management_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Test schema lifecycle
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Test-only JWT key, never use in production
app.jwt.secret=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
app.jwt.expiration-minutes=60
