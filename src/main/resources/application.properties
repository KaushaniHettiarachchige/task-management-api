spring.application.name=task-management-api

# Server Configuration
server.port=8080

# MySQL connection
spring.datasource.url=jdbc:mysql://localhost:3306/task_management_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

#JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60

#Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

## Request / Error Logging
logging.level.root=INFO
logging.level.com.example.taskmanagement.logging=INFO
logging.level.com.example.taskmanagement.exception=INFO
logging.pattern.level=%5p [requestId:%X{requestId:-none}]
logging.file.name=logs/task-management-api.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB