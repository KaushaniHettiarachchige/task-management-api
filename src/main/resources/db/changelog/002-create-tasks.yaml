
databaseChangeLog:
  - changeSet:
      id: "002-create-tasks"
      author: "task-management-team"

      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - not:
            - tableExists:
                tableName: tasks

      changes:
        - createTable:
            tableName: tasks
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_tasks
                    nullable: false

              - column:
                  name: title
                  type: VARCHAR(150)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: VARCHAR(2000)

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: due_date
                  type: DATE

              - column:
                  name: owner_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: tasks
            baseColumnNames: owner_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_tasks_owner

        - createIndex:
            tableName: tasks
            indexName: idx_tasks_owner
            columns:
              - column:
                  name: owner_id
